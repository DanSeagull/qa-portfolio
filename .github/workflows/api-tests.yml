name: API tests

on:
  push:
    paths:
      - "api-automation/**"
  pull_request:
    paths:
      - "api-automation/**"
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api-automation
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api-automation/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest --alluredir=allure-results

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: api-automation/allure-results
